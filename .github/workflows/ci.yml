# Until now nothing ran before merge. lefthook covers staged JS/TS/JSON on the
# machine that happens to commit, and touches no .svg at all, so icon changes
# reached main with zero automated checks and `validate-icons.mjs` only ran
# later, at publish time, inside `npm run release`. By then the drift is already
# on main.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check:types
      - name: Validate icons
        run: npm run validate --workspace blode-icons-react
      - name: Validate icon metadata
        run: npm run validate:icons-data --workspace blode-icons-react
      - name: Build
        run: npm run build
